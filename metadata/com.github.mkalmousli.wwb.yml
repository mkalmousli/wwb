Donate: https://ko-fi.com/mkalmousli

AutoName: WayWayBack

RepoType: git
Repo: https://github.com/mkalmousli/wwb

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export version=$(grep flutter .fvmrc | cut -d ":" -f2 | cut -d '"' -f2)
      - '[[ $version ]] || exit 1'
      - git -C $$flutter$$ checkout -f $version
      - export repo=/tmp/app
      - rm -rf $repo
      - cd ..
      - mv com.github.mkalmousli.wwb $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - popd
      - mv $repo com.github.mkalmousli.wwb
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/app
      - cd ..
      - mv com.github.mkalmousli.wwb $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv $repo com.github.mkalmousli.wwb

# F-Droid rebuilds from source; if the result matches the signed APK on the
# GitHub release (signatures stripped) it ships that one instead.
Binaries: https://github.com/mkalmousli/wwb/releases/download/v%v/wwb-%v-universal.apk
AllowedAPKSigningKeys: 2248c5fa900222741f2b94f0c9ed68c1590bdb27ae2ff5d72e3c5dc10601d9b9

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
