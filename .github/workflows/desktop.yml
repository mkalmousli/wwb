name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ${{ matrix.target }} --release

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar -C build/linux/x64/release/bundle -czf "wwb-$v-linux-x64.tar.gz" .

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $v = "${env:GITHUB_REF_NAME}" -replace '^v',''
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "wwb-$v-windows-x64.zip"

      - name: Package (macOS)
        if: matrix.target == 'macos'
        run: |
          v="${GITHUB_REF_NAME#v}"
          ( cd build/macos/Build/Products/Release && zip -qr - "wwb.app" ) > "wwb-$v-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: wwb-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
