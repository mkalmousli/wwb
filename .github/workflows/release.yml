name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproducible-apk:
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # The developer signing key. F-Droid strips signatures before comparing,
      # so this only affects who signs the published binary, not reproducibility.
      - name: Restore signing key
        if: env.HAVE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/mkalmousli.github.jks
          cat > android/key.properties <<EOF
          storeFile=mkalmousli.github.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the reproducible image
        run: docker build -t wwb-build .

      - name: Build app.apk (reproducible, universal)
        run: docker run --rm -v "$PWD":/tmp/app wwb-build /tmp/app/build.py

      - name: Name the artifacts
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$v" ] && v="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          cp app.apk "dist/wwb-$v-universal.apk"
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: wwb-apk
          path: dist/*

      # Only publish when the APK is signed with the developer key. Otherwise
      # the run is just a reproducibility check and the maintainer uploads a
      # locally-signed APK to the release.
      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
